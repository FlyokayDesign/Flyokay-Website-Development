<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TESIMAI 预览工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;font:14px Arial;color:#111}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff;gap:12px}button,a{font:inherit;border:1px solid #ddd;background:white;padding:10px 16px;border-radius:20px;text-decoration:none;color:#111;cursor:pointer}button.active{background:#111;color:white}#stage{height:calc(100vh - 64px);overflow:hidden;padding:24px;display:flex;justify-content:center;align-items:flex-start}#wrap{flex:none}iframe{border:0;display:block;background:#fff;transform-origin:top left}small{color:#666} @media(max-width:650px){header{padding:8px;height:100px;flex-wrap:wrap}#stage{padding:12px;height:calc(100vh - 100px)}small{display:none}}</style><header><div><b>TESIMAI · 导航 / Hero / Catalog / About Us / Trusted Feedback / Contact Us</b> <small>1920px / 390px · 白底整合预览</small></div><div><button id="d" class="active">1920px</button> <button id="m">390px</button> <button id="r">重新预览</button> <a href="index.html" target="_blank">独立打开</a></div></header><div id="stage"><div id="wrap"><iframe title="TESIMAI 可操作预览" src="index.html"></iframe></div></div><script>let width=1920;const f=document.querySelector('iframe'),s=document.querySelector('#stage'),w=document.querySelector('#wrap');function size(){let padding=innerWidth<650?24:48;const scale=Math.min(1,(s.clientWidth-padding)/width),h=Math.max(600,(s.clientHeight-padding)/scale);f.style.width=width+'px';f.style.height=h+'px';f.style.transform='scale('+scale+')';w.style.width=width*scale+'px';w.style.height=h*scale+'px';document.querySelector('#d').classList.toggle('active',width===1920);document.querySelector('#m').classList.toggle('active',width===390)}document.querySelector('#d').onclick=()=>{width=1920;size()};document.querySelector('#m').onclick=()=>{width=390;size()};document.querySelector('#r').onclick=()=>f.contentWindow.location.reload();onresize=size;size();</script></html>
