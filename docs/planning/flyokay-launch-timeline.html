<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLYOKAY Shopify 主题详细规划</title>
  <style>
    :root{--paper:#F7F1E8;--surface:#FFFDF9;--ink:#4A4741;--deep:#1C1B1A;--muted:#77716A;--line:#D3D1CE;--blue:#179BD7;--blue-dark:#126B95;--green:#277B59;--gold:#A46B0A;--radius:14px;--shadow:0 14px 36px rgba(74,71,65,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.shell{width:min(1120px,calc(100% - 36px));margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:19px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;color:var(--deep);font-weight:700;letter-spacing:.06em;text-decoration:none}.orb{width:19px;height:19px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 8px rgba(23,155,215,.12)}.topbar a:not(.brand){color:var(--blue-dark);font-size:13px;font-weight:600}.page-title{margin:35px 0 0;color:var(--deep);font-size:clamp(30px,5vw,48px);font-weight:300;letter-spacing:-.05em;line-height:1.06}.plan-meta{display:flex;flex-wrap:wrap;gap:9px 24px;margin:14px 0 0;padding-bottom:31px;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px}.plan-meta b{color:var(--ink)}.section{padding-top:42px}.section h2{margin:0 0 17px;color:var(--deep);font-size:clamp(24px,3.5vw,35px);font-weight:300;letter-spacing:-.04em}.gate-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.gate{min-height:145px;padding:15px;border:1px solid rgba(74,71,65,.13);border-radius:12px;background:var(--surface)}.gate-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--blue-dark);font-size:12px;font-weight:700;letter-spacing:.06em}.due{padding:3px 7px;border-radius:999px;background:#FFF8E7;color:var(--gold);font-size:11px;font-weight:600;letter-spacing:0;white-space:nowrap}.gate h3{margin:12px 0 0;color:var(--deep);font-size:14px;line-height:1.35}.gate p{margin:7px 0 0;color:var(--muted);font-size:12px}.bar-wrap{overflow-x:auto;padding-bottom:4px}.gantt{min-width:840px;display:grid;grid-template-columns:170px repeat(11,minmax(50px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.gantt>div{min-height:42px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.week-head{display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.32);color:var(--muted);font-size:10px}.week-head b{color:var(--ink);font-size:11px}.lane-label{display:flex;align-items:center;background:rgba(255,255,255,.32);color:var(--deep);font-size:13px;font-weight:600}.lane-cell{position:relative;padding:5px!important}.lane{height:100%;min-height:30px;border-radius:7px}.foundation{background:rgba(164,107,10,.18)}.build{background:rgba(23,155,215,.26)}.quality{background:rgba(39,123,89,.19)}.launch{background:var(--deep)}.launch::after{content:"上线";position:absolute;inset:7px;color:#fff;font-size:11px;font-weight:700;text-align:center}.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:12px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;border-radius:3px;vertical-align:-1px}.timeline{display:grid;gap:10px;padding-bottom:60px}.week{border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,253,249,.78);overflow:hidden}.week[open]{background:var(--surface);box-shadow:var(--shadow)}.week summary{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(126px,auto) 22px;gap:14px;align-items:center;padding:17px 19px;cursor:pointer;list-style:none}.week summary::-webkit-details-marker{display:none}.week-code{color:var(--blue-dark);font-size:12px;font-weight:700;letter-spacing:.06em}.week-title{color:var(--deep);font-size:16px;font-weight:600}.week-date{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:400}.week-status{appearance:none;min-width:122px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;padding:7px 9px;font-size:12px}.week-status[data-value="in_progress"]{border-color:rgba(164,107,10,.5);background:#FFF9EB;color:var(--gold)}.week-status[data-value="completed"]{border-color:rgba(39,123,89,.45);background:#EFF8F2;color:var(--green)}.chev{color:var(--muted);font-size:20px;transition:transform .18s}.week[open] .chev{transform:rotate(45deg)}.week-body{padding:0 19px 19px}.hours{margin:0 0 12px;color:var(--blue-dark);font-size:13px;font-weight:600}.week-grid{display:grid;grid-template-columns:1.18fr .82fr;gap:13px}.tasks{margin:0;padding:14px 16px 14px 33px;border-left:3px solid var(--blue);background:#F2F8FB;color:var(--ink);font-size:13px}.tasks li+li{margin-top:6px}.evidence{padding:14px 16px;background:#FAF3E9}.evidence b{display:block;margin-bottom:5px;color:var(--deep);font-size:12px}.evidence p{margin:0;color:var(--ink);font-size:13px}.footer{padding:20px 0 38px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer a{color:var(--blue-dark);font-weight:600}@media(max-width:820px){.gate-grid{grid-template-columns:repeat(2,1fr)}.week summary{grid-template-columns:74px minmax(0,1fr) 20px;gap:10px;padding:15px}.week-status{grid-column:2;grid-row:2;justify-self:start}.chev{grid-column:3;grid-row:1/span 2;align-self:center}.week-body{padding:0 13px 14px}.week-grid{grid-template-columns:1fr}}@media(max-width:480px){.shell{width:min(100% - 28px,1120px)}.topbar{align-items:flex-start}.topbar a:not(.brand){font-size:11px}.gate-grid{grid-template-columns:1fr}.page-title{margin-top:29px}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="页面导航"><a class="brand" href="#top"><span class="orb" aria-hidden="true"></span>FLYOKAY</a><a href="https://github.com/FlyokayDesign/Flyokay-Website-Development/issues/1" target="_blank" rel="noreferrer">正式规格 Issue #1 ↗</a></nav>
    <h1 class="page-title" id="top">Shopify 主题详细规划</h1>
    <div class="plan-meta"><span><b>开始：</b>2026 年 8 月 10 日</span><span><b>每周投入：</b>35 小时</span><span><b>计划周期：</b>11 周</span><span><b>条件性上线窗口：</b>2026 年 10 月 22–25 日</span></div>
    <section class="section"><h2>决策门与最晚确认日期</h2><div class="gate-grid" id="gate-grid"></div></section>
    <section class="section"><h2>阶段排程</h2><div class="bar-wrap"><div class="gantt" id="gantt" role="img" aria-label="11 周项目甘特时间线"></div></div><div class="legend"><span><i style="background:rgba(164,107,10,.35)"></i>准备与基础</span><span><i style="background:rgba(23,155,215,.42)"></i>主题与页面开发</span><span><i style="background:rgba(39,123,89,.35)"></i>测试与验收</span><span><i style="background:#1C1B1A"></i>发布与观察</span></div></section>
    <section class="section"><h2>每周详细规划</h2><div class="timeline" id="timeline"></div></section>
    <footer class="footer">依据 <a href="https://github.com/FlyokayDesign/Flyokay-Website-Development/issues/1" target="_blank" rel="noreferrer">FLYOKAY Shopify theme 0–1 execution workflow</a> 制作。上线前必须完成未发布主题验收、书面批准与回滚准备；任一阻塞项未解决时，不发布。</footer>
  </main>
  <script>
    const storageKey='flyokay-11-week-timeline-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}
    const gates=[['G1','8/14','Figma 节点链接','Landing、Store、Product 的桌面与移动端 node-id。'],['G2','8/14','主题权限与开发主题','Theme Access、正确店铺、未发布主题。'],['G3','8/21','App 商店链接与 QR','最终 iOS/Android URL 与批准 QR 资产。'],['G4','8/21','两件 20% off 规则','先在 Shopify 验证自动折扣、排除与文案。'],['G5','8/28','媒体与变体映射','两种外壳的主图、alt text 和对应关系。'],['G6','8/28','政策与合规文案','保修、成人监督、联系方式和政策终稿。'],['G7','9/4','评价服务商','选择、历史评价来源、导入与展示方式。'],['G8','9/4','首单邮件策略','优惠规则（若有）与 Shopify Email 发件身份。']];
    const weeks=[
      ['W01','8/10–8/16','项目治理、商品真相、G1/G2','35 小时：项目规则/Issue 6h；商品与履约数据 16h；权限与决策门 7h；本周复核与修复 6h。',['核对 GitHub 仓库、Issue 标签、AGENTS.md、CONTEXT.md、.gitignore；正式主题仅放入 shopify-theme/。','在 Shopify 核对产品、两个外壳变体、同价 $49.99、SKU、库存、重量、税务与运输设置。','建立产品事实来源表：包装内容、App、6+ 建议、飞行/充电/温度/使用环境；不得把 6+ 写成包装配置。','取得 G1、G2；未取得时在 Issue #1 标记 needs-info，并只继续不依赖它的准备。'],'商品事实表、变体后台截图、G1/G2 状态与负责人可追溯。','foundation'],
      ['W02','8/17–8/23','开发环境、Figma 映射、G3/G4','35 小时：Shopify CLI 与开发主题 11h；Figma section map 12h；App/折扣核对 5h；测试与记录 7h。',['安装/认证 Shopify CLI，连接未发布主题，验证 theme dev、热更新、主题编辑器和生产主题未被改动。','按 node-id 拆分 Landing、Store、Product：页面模板、section/snippet、可编辑设置、数据源、资产、响应式行为与验收标准。','取得 App Store/Google Play URL 与 QR；未取得时仅建立接入位置。','在 Shopify 配置并测试两件 20% 自动折扣；未通过测试则产品页和购物车不显示促销承诺。'],'本地到未发布主题预览可用；section map 完成；G3/G4 有测试结论。','foundation'],
      ['W03','8/24–8/30','媒体、政策输入、主题基础','35 小时：媒体登记/拍摄计划 13h；设计令牌和代码基础 12h；政策与合规核对 4h；响应式检查 6h。',['盘点白底图、儿童使用、成人派对、App 录屏；建立 PDP 缺失主图、特写、送礼和颜色对应素材清单。','为所有首发素材登记用途、裁切、焦点、版权、alt text、桌面/手机尺寸与变体媒体对应。','将 DESIGN.md 的色彩、Inter、间距、圆角、断点、focus、reduced motion 建为 CSS/主题基础。','取得 G5、G6；没有批准图片或政策文案时，不用占位事实进入客户页面。'],'媒体登记表与拍摄清单；主题基础 token 可复用；G5/G6 已解决或记录阻塞。','foundation'],
      ['W04','8/31–9/6','全局壳层、主题编辑器、G7/G8','35 小时：header/footer/导航 15h；可复用 snippet 与内容模型 9h；主题编辑器/键盘测试 5h；评价邮件决策 6h。',['完成 header、footer、公告栏、导航、购物车入口、政策/社媒链接和 skip link。','建立 price、media、product option label、button、badge 等 snippet；不硬编码评价或邮件服务商。','配置 locale key，为未来多语言预留结构；首发英文只使用已批准文案。','确认 G7/G8；若仍未知，Email 保持无优惠状态，评价区仅保留 app-block 接口。'],'主题编辑器可增删重排 section；键盘可到达全局导航；G7/G8 状态明确。','foundation'],
      ['W05','9/7–9/13','首页：价值、送礼、App 流程','35 小时：首页 Hero/CTA 10h；真实场景模块 9h；App/信任/邮件模块 8h；手机与无 JS 检查 8h。',['实现产品类别、礼物优先价值、生日/节日场景、明确产品 CTA；使用经过批准的真实素材。','实现购后 App 流程：蓝牙连接、在 App 上传图片/动态图片/Emoji/文字、飞行展示；不得暗示结账上传。','加入经批准的配送、退货、使用建议和 App 下载模块；G3 未完成时不放 QR 或虚构链接。','接入 Shopify Email app block/embed；G8 未完成时使用中性订阅文案。'],'首页在桌面/手机均能理解产品并进入购买；禁用 JavaScript 时 CTA 和内容仍可用。','build'],
      ['W06','9/14–9/20','产品页：真实变体与购买路径','35 小时：图库/变体逻辑 14h；购买表单 8h；产品事实与 FAQ 6h；变体/移动测试 7h。',['由 Shopify product media 和 selected variant 驱动图库；两种颜色必须显示各自对应的真实外壳图。','建立可访问 Shell color 选择器，同时更新 variant ID、URL、价格、库存、媒体和 add-to-cart 状态。','加入包装内容、规格、年龄/环境建议、发货、退货、保修和 App 文案，均以批准来源为准。','测试直接变体 URL、售罄、错误、键盘、触控、购物车行项目和无 JavaScript 回退。'],'Blue / Purple 与 Black / Gold 都能完成“链接 → 正确图片 → 加购 → 购物车”测试。','build'],
      ['W07','9/21–9/27','产品页收尾、促销、评价、3D 回退','35 小时：折扣/评价/QR 6h；PDP 回归 10h；3D 渐进增强或静态回退 8h；性能/无障碍修复 11h。',['仅在 G4 完成且 Shopify 测试通过时显示“两件 20% off”；从 PDP、购物车到结账验证条件。','仅在 G7 完成时安装评价 app block，导入可追溯评价并检查不重复加载。','3D 只作为可选增强：静态海报优先、触控/键盘替代、reduced motion、失败回退、与变体状态分离；不满足则延后。','修复 PDP 的媒体、焦点、表单、性能和小屏问题。'],'促销/评价/3D 均不破坏核心购买路径；不满足条件的模块保持安全空状态。','build'],
      ['W08','9/28–10/4','Store、支持页、集成审计','35 小时：Store/How It Works 10h；支持与政策页 10h；cart/search/404 6h；集成与设备测试 9h。',['将 Store 做成一产品的策展式模板，不创建虚假的多商品目录或交叉销售。','完成 How It Works、FAQ、Contact、Shipping & Returns、Privacy、Terms；与 App 流程、手册和批准政策一致。','完成 cart、search、404 的返回购买/支持路径。','验证 App 链接与 QR；审计 Email/评价脚本、cookie/数据分享、可访问性、重复加载和移除方式。'],'菜单/页脚链接全部可达；支持页无未批准承诺；所有必要集成只加载一次。','build'],
      ['W09','10/5–10/11','性能、无障碍、SEO/GEO','35 小时：性能基线与图片优化 10h；无障碍与无 JS 8h；SEO/结构化数据 8h；回归与缺陷记录 9h。',['测量首页、PDP、Store、cart 的桌面/手机基线，识别 LCP，检查图片尺寸、CDN、lazy-load、字体、JS 与第三方成本。','测试键盘、focus、label、对比度、触控目标、缩放/重排、reduced motion、慢网、图片/3D 失败与 no-JS 购买路径。','检查 title、description、canonical、heading、内部链接、可见 FAQ/support、Product/Offer/Breadcrumb/Organization JSON-LD 与直接变体 URL。','运行 Theme Check；缺陷按 needs-info、ready-for-agent、ready-for-human 分类并给出证据。'],'性能/无障碍/SEO 清单有可复现记录；无关键 Theme Check 错误。','quality'],
      ['W10','10/12–10/18','未发布主题端到端验收','35 小时：全流程测试 15h；多设备 Figma 对照 7h；测试订单/证据包 5h；缺陷修复 8h。',['仅在未发布主题上测试；不可为测试覆盖生产主题。','逐一验证两种变体、媒体、价格、库存、直接 URL、购物车、两件折扣、免邮、配送/退货/政策、App/QR、订阅、评价、搜索、404 和结账交接。','按 1920、1440、1024、768、390 与中间宽度对照批准 Figma 节点。','整理截图、测试订单、性能/无障碍/SEO 报告；保存当前生产主题作为回滚目标。'],'完成的验收包、候选 commit、候选 theme ID、回滚主题与阻塞缺陷清单。','quality'],
      ['W11','10/19–10/25','阻塞缺陷修复、批准、发布与观察','35 小时：阻塞缺陷修复 12h；复测/书面批准 8h；发布/冒烟测试 6h；上线观察与复盘 9h。',['周一至周三只修复 N10/N11 中的阻塞问题；禁止新增页面、插件或未经批准文案。','获得内容、产品声明、政策、折扣、支持设备和候选主题的书面批准；没有批准则不发布。','发布后立即测试首页、PDP、颜色、购物车、优惠、结账、政策、App 链接和移动布局。','每天观察订单、邮件、评价、支持反馈、性能与索引；出现重大商业、法律、无障碍或性能问题立即回滚并在 GitHub 建 Issue。'],'生产冒烟测试日志、监控记录、回滚准备和上线后复盘 Issue。','launch']
    ];
    document.getElementById('gate-grid').innerHTML=gates.map(g=>`<article class="gate"><div class="gate-head"><span>${g[0]}</span><span class="due">最晚 ${g[1]}</span></div><h3>${g[2]}</h3><p>${g[3]}</p></article>`).join('');
    const gantt=document.getElementById('gantt');gantt.innerHTML=`<div class="week-head"><b>阶段</b><span>开始 8/10</span></div>${weeks.map((w,i)=>`<div class="week-head"><b>W${String(i+1).padStart(2,'0')}</b><span>${w[1].split('–')[0]}</span></div>`).join('')}`+['准备与基础','主题与页面开发','测试与验收','发布与观察'].map((label,row)=>`<div class="lane-label">${label}</div>${weeks.map(w=>{const active=(row===0&&w[6]==='foundation')||(row===1&&w[6]==='build')||(row===2&&w[6]==='quality')||(row===3&&w[6]==='launch');return `<div class="lane-cell">${active?`<div class="lane ${w[6]}"></div>`:''}</div>`}).join('')}`).join('');
    const status=(key)=>{const value=saved[key]||'not_started';return `<select class="week-status" data-key="${key}" data-value="${value}" aria-label="${key} 进度"><option value="not_started" ${value==='not_started'?'selected':''}>未开始</option><option value="in_progress" ${value==='in_progress'?'selected':''}>进行中</option><option value="completed" ${value==='completed'?'selected':''}>已完成</option></select>`};
    document.getElementById('timeline').innerHTML=weeks.map((w,i)=>`<details class="week" ${i===0?'open':''}><summary><span class="week-code">${w[0]}</span><span><span class="week-title">${w[2]}</span><span class="week-date">${w[1]}</span></span>${status(w[0])}<span class="chev" aria-hidden="true">+</span></summary><div class="week-body"><p class="hours">${w[3]}</p><div class="week-grid"><ul class="tasks">${w[4].map(t=>`<li>${t}</li>`).join('')}</ul><div class="evidence"><b>本周完成证据</b><p>${w[5]}</p></div></div></div></details>`).join('');
    document.querySelectorAll('.week-status').forEach(el=>{el.addEventListener('click',e=>e.stopPropagation());el.addEventListener('change',e=>{saved[e.target.dataset.key]=e.target.value;try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(err){}e.target.dataset.value=e.target.value})});
  </script>
</body>
</html>
